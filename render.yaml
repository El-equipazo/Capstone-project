databases:
  - name: quantumconnect-db
    databaseName: quantumconnect
    plan: free

services:
  - type: web
    name: quantumconnect
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quantumconnect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
